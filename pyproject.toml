[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-mathematician-workspace"
version = "0.2.0"
description = "Lightweight harness for a coding-agent-driven AI Co-Mathematician workspace."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=6.6.2,<7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
co-math = "harness.co_math.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.co_math.resources" = ["*.md"]
